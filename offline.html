<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FINEX - Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #050d0c;
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #0c1a18;
      border-radius: 16px;
      padding: 40px 28px;
      max-width: 360px;
      width: 100%;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .logo {
      font-size: 32px;
      font-weight: 700;
      color: #00e5a0;
      margin-bottom: 16px;
    }
    h1 { font-size: 22px; margin-bottom: 12px; }
    p { color: #8a9e99; font-size: 15px; line-height: 1.5; margin-bottom: 24px; }
    button {
      background: #00e5a0;
      color: #041a15;
      border: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
    button:active { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">FINEX</div>
    <h1>You're offline</h1>
    <p>Check your internet connection and try again. Some screens may still work offline.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
  </html>
